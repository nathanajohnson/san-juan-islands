<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <!-- Abstract formline-inspired pattern: ovoids, U-forms, wave lines — educational homage, not tribal crest -->
  <defs>
    <pattern id="formline" width="200" height="200" patternUnits="userSpaceOnUse">
      <rect width="200" height="200" fill="none"/>
      <!-- ovoid -->
      <ellipse cx="50" cy="50" rx="28" ry="18" fill="none" stroke="#c4a35a" stroke-width="2.5" opacity="0.35"/>
      <ellipse cx="50" cy="50" rx="12" ry="8" fill="#c4a35a" opacity="0.2"/>
      <!-- U-form -->
      <path d="M100 30 Q100 70 130 70 Q100 70 100 110" fill="none" stroke="#5ba3c4" stroke-width="2.5" opacity="0.3" stroke-linecap="round"/>
      <!-- wave / salmon spine suggestion -->
      <path d="M20 140 Q50 120 80 140 T140 140 T200 140" fill="none" stroke="#2d6b4a" stroke-width="2" opacity="0.25"/>
      <path d="M10 170 Q40 155 70 170 T130 170 T190 170" fill="none" stroke="#a8d5e5" stroke-width="1.5" opacity="0.2"/>
      <!-- small ovoid cluster -->
      <ellipse cx="160" cy="80" rx="16" ry="11" fill="none" stroke="#c45c26" stroke-width="2" opacity="0.28"/>
      <circle cx="160" cy="80" r="4" fill="#c45c26" opacity="0.25"/>
      <!-- crescent -->
      <path d="M30 100 A18 18 0 1 1 30 120" fill="none" stroke="#d4a84b" stroke-width="2" opacity="0.22"/>
    </pattern>
  </defs>
  <rect width="200" height="200" fill="url(#formline)"/>
</svg>
